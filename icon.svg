<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Composer Preview">
  <!--
    Lucide "columns-2" with the two halves filled in: the text being written
    on the left and its preview on the right, recoloured to the Avocado
    palette like the ramon/chat icon.

    The frame and the split take the deep green (#337D63), the lines inside
    the mid leaf (#89BA4F): both hold contrast on the white tile, where the
    highlight leaf (#9EEA6C) would wash out.

    Stroked rather than filled, matching Lucide, and `vector-effect` keeps the
    stroke weight honest if Flarum scales the icon in the extensions list.
  -->
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke">
    <rect x="3" y="3" width="18" height="18" rx="2" stroke="#337D63" />
    <path d="M12 3v18" stroke="#337D63" />
    <path d="M6.5 8h2M6.5 12h2M6.5 16h2" stroke="#89BA4F" />
    <path d="M15.5 8h2M15.5 12h2M15.5 16h1" stroke="#89BA4F" />
  </g>
</svg>
